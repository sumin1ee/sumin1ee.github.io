# ─── Site ────────────────────────────────────────────────────────────────
title: Sumin Lee
tagline: Research notebook on vision-centric autonomous driving.
description: >-
  Open research notebook of Sumin Lee — MS researcher at the Intelligent
  Robotics & Computer Vision Lab, Hanyang University. Notes on Gaussian
  Splatting, online vectorized HD map construction, and end-to-end driving.
url: "https://sumin1ee.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

# Analytics — GoatCounter (cookieless). Dashboard: https://sumin1ee.goatcounter.com
goatcounter: sumin1ee

# ─── Author ──────────────────────────────────────────────────────────────
author:
  name: Sumin Lee
  email: maroona@hanyang.ac.kr
  github: sumin1ee
  cv: "https://sumin1ee.github.io/cv"
  affiliation: Intelligent Robotics & Computer Vision Lab · Hanyang University
  affiliation_url: "https://ircvlab.github.io"

# ─── Build ───────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /posts/:slug/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3
  math_engine: false   # leave $$...$$ untouched; MathJax (loaded per-post) renders it

paginate: 8
paginate_path: "/page:num/"

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# ─── Defaults ────────────────────────────────────────────────────────────
defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      toc: true
  - scope: { path: "_pages" }
    values:
      layout: page
      permalink: /:basename/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - LICENSE

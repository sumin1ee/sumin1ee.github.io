---
layout: default
---
<div class="shell page-shell">
  <article class="page-article">
    <header class="page-head">
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    <div class="page-content">
      {{ content }}
    </div>
  </article>
</div>

---
layout: default
---
<div class="shell archive-shell">
  <header class="archive-head">
    <p class="archive-kicker">category</p>
    <h1 class="archive-title">{{ page.title }}</h1>
    <p class="archive-meta">{{ page.posts.size }} {% if page.posts.size == 1 %}entry{% else %}entries{% endif %}</p>
  </header>
  <ul class="archive-list">
    {% for post in page.posts %}
      <li class="archive-item">
        <a href="{{ post.url | relative_url }}" class="archive-link">
          <time class="archive-date">{{ post.date | date: '%Y·%m·%d' }}</time>
          <span class="archive-name">{{ post.title }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
  <p class="back-row">
    <a href="{{ '/categories/' | relative_url }}" class="back-link"><i class="fas fa-arrow-left"></i> all categories</a>
  </p>
</div>

---
layout: page
title: Categories
permalink: /categories/
---

{% assign cats = site.categories | sort %}
<ul class="taxonomy-list">
  {% for cat in cats %}
    <li class="taxonomy-item">
      <a href="{{ '/categories/' | append: cat[0] | downcase | relative_url }}">
        <span class="taxonomy-name">{{ cat[0] }}</span>
        <span class="taxonomy-count">{{ cat[1].size }}</span>
      </a>
    </li>
  {% else %}
    <li class="empty">No categories yet.</li>
  {% endfor %}
</ul>

# Grouped reading list, venue-verified.
# Items: { title, authors, venue, year, award?, url, note? }

groups:
  - id: nerf
    label: Neural Radiance Fields
    blurb: "The implicit ancestor: representing scenes as continuous radiance functions, sampled by ray marching."
    items:
      - title: "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis"
        authors: "Mildenhall, Srinivasan, Tancik, Barron, Ramamoorthi, Ng"
        venue: "ECCV"
        year: 2020
        award: "Oral · Best Paper Honorable Mention"
        url: "https://arxiv.org/abs/2003.08934"
        note: "The paper that started everything — volume rendering meets MLPs."

      - title: "NeRF in the Wild: Neural Radiance Fields for Unconstrained Photo Collections"
        authors: "Martin-Brualla et al."
        venue: "CVPR"
        year: 2021
        url: "https://arxiv.org/abs/2008.02268"

      - title: "PixelNeRF: Neural Radiance Fields from One or Few Images"
        authors: "Yu et al."
        venue: "CVPR"
        year: 2021
        url: "https://arxiv.org/abs/2012.02190"

      - title: "Mip-NeRF: A Multiscale Representation for Anti-Aliasing Neural Radiance Fields"
        authors: "Barron et al."
        venue: "ICCV"
        year: 2021
        award: "Oral · Honorable Mention"
        url: "https://arxiv.org/abs/2103.13415"

      - title: "BARF: Bundle-Adjusting Neural Radiance Fields"
        authors: "Lin et al."
        venue: "ICCV"
        year: 2021
        award: "Oral"
        url: "https://arxiv.org/abs/2104.06405"

      - title: "Nerfies: Deformable Neural Radiance Fields"
        authors: "Park et al."
        venue: "ICCV"
        year: 2021
        url: "https://arxiv.org/abs/2011.12948"

      - title: "Plenoxels: Radiance Fields without Neural Networks"
        authors: "Yu, Fridovich-Keil et al."
        venue: "CVPR"
        year: 2022
        award: "Oral"
        url: "https://arxiv.org/abs/2112.05131"
        note: "Sparse voxel grids — the first hint that explicit primitives could beat MLPs on speed."

      - title: "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding"
        authors: "Müller et al."
        venue: "SIGGRAPH (TOG)"
        year: 2022
        award: "Best Paper"
        url: "https://arxiv.org/abs/2201.05989"
        note: "Instant-NGP — multi-resolution hash grids; training a NeRF in seconds."

      - title: "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields"
        authors: "Barron et al."
        venue: "CVPR"
        year: 2022
        url: "https://arxiv.org/abs/2111.12077"

      - title: "TensoRF: Tensorial Radiance Fields"
        authors: "Chen et al."
        venue: "ECCV"
        year: 2022
        url: "https://arxiv.org/abs/2203.09517"

      - title: "K-Planes: Explicit Radiance Fields in Space, Time, and Appearance"
        authors: "Fridovich-Keil et al."
        venue: "CVPR"
        year: 2023
        award: "Highlight"
        url: "https://arxiv.org/abs/2301.10241"

      - title: "Zip-NeRF: Anti-Aliased Grid-Based Neural Radiance Fields"
        authors: "Barron et al."
        venue: "ICCV"
        year: 2023
        url: "https://arxiv.org/abs/2304.06706"

      - title: "Nerfstudio: A Modular Framework for Neural Radiance Field Development"
        authors: "Tancik et al."
        venue: "SIGGRAPH"
        year: 2023
        url: "https://arxiv.org/abs/2302.04264"

